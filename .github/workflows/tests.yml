name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-tests:
    name: Shell tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run test suites
        shell: bash
        run: |
          set -euo pipefail

          for test_file in tests/*.sh; do
            echo "::group::${test_file}"
            bash "${test_file}"
            echo "::endgroup::"
          done
